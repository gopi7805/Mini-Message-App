
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Message App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>💬 Mini Message App</h1>
        <p>Send a message to your Spring Boot Backend</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>✉️ Send a Message</h2>

            <input type="text" id="msg"
                   placeholder="Type your message here...">

            <button onclick="sendMessage()">Send Message 🚀</button>

            <p class="info">Your message will be sent to the backend.</p>
        </div>

        <div class="card response-card">
            <h2>✅ Response from Backend</h2>

            <div id="result">
                Your response will appear here...
            </div>
        </div>

    </div>

    <div class="footer">
        <h2>How It Works?</h2>
        <p>Frontend → Fetch Request → Spring Boot → Response</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
